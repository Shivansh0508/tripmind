<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Trips — TripMind</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050508;--border:rgba(255,255,255,0.08);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--accent:#e8845c;--accent2:#d4a853}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.35}
.orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(232,132,92,0.2),transparent);top:-150px;right:-150px}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(100,80,200,0.12),transparent);bottom:-100px;left:-100px}

nav{position:sticky;top:0;z-index:100;padding:1rem 5vw;display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,8,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:var(--text);text-decoration:none}
.logo span{color:var(--accent);font-style:italic}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-link{font-size:0.83rem;color:var(--muted);text-decoration:none;transition:color 0.2s}
.nav-link:hover{color:var(--text)}
.btn-new{padding:0.5rem 1.3rem;border-radius:0.4rem;background:linear-gradient(135deg,var(--accent),#c4622d);color:#fff;font-size:0.82rem;font-weight:600;text-decoration:none;box-shadow:0 2px 12px rgba(232,132,92,0.25);transition:all 0.2s}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(232,132,92,0.4)}

.page-header{position:relative;z-index:1;padding:3rem 5vw;border-bottom:1px solid var(--border)}
.ph-eyebrow{font-size:0.72rem;color:var(--accent);letter-spacing:0.18em;text-transform:uppercase;font-weight:600;margin-bottom:0.6rem}
.ph-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3rem);font-weight:600;letter-spacing:-0.03em;line-height:1.1}
.ph-title em{font-style:italic;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ph-count{font-size:0.83rem;color:var(--muted);margin-top:0.5rem}

.content{position:relative;z-index:1;padding:3rem 5vw}

.empty-state{text-align:center;padding:6rem 2rem}
.empty-icon{font-size:4rem;margin-bottom:1.5rem;opacity:0.6}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;margin-bottom:0.8rem}
.empty-sub{font-size:0.9rem;color:var(--muted);margin-bottom:2.5rem;font-weight:300;max-width:400px;margin-left:auto;margin-right:auto;margin-bottom:2.5rem}
.btn-plan{padding:1rem 2.5rem;background:linear-gradient(135deg,var(--accent),#c4622d);color:#fff;border-radius:0.5rem;text-decoration:none;font-size:0.95rem;font-weight:600;box-shadow:0 4px 25px rgba(232,132,92,0.3);transition:all 0.3s;display:inline-block}
.btn-plan:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(232,132,92,0.45)}

.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}

.trip-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:1.2rem;overflow:hidden;transition:all 0.3s;cursor:pointer;animation:fadeUp 0.5s ease both}
.trip-card:hover{transform:translateY(-5px);border-color:rgba(232,132,92,0.3);box-shadow:0 12px 40px rgba(232,132,92,0.1)}
.trip-card:nth-child(1){animation-delay:0.05s}
.trip-card:nth-child(2){animation-delay:0.1s}
.trip-card:nth-child(3){animation-delay:0.15s}
.trip-card:nth-child(4){animation-delay:0.2s}
.trip-card:nth-child(5){animation-delay:0.25s}
.trip-card:nth-child(6){animation-delay:0.3s}

.tc-header{padding:1.5rem;background:linear-gradient(135deg,rgba(232,132,92,0.12),rgba(196,98,45,0.06));border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.tc-header::before{content:'';position:absolute;top:-50%;right:-30%;width:150px;height:150px;background:radial-gradient(circle,rgba(232,132,92,0.12),transparent);border-radius:50%}
.tc-cities{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--text);line-height:1.2;position:relative}
.tc-date{font-size:0.7rem;color:var(--muted);margin-top:0.3rem;position:relative}

.tc-body{padding:1.2rem 1.5rem}
.tc-tags{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem}
.tc-tag{font-size:0.68rem;padding:0.2rem 0.6rem;border-radius:2rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted)}
.tc-preview{font-size:0.8rem;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}

.tc-footer{padding:0.8rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.view-link{font-size:0.8rem;font-weight:500;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:0.3rem;transition:gap 0.2s}
.view-link:hover{gap:0.6rem}
.del-btn{font-size:0.75rem;color:rgba(240,237,232,0.25);background:none;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:color 0.2s;padding:0}
.del-btn:hover{color:#f87171}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="bg-mesh"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<nav>
  <a href="/" class="logo">Trip<span>Mind</span></a>
  <div class="nav-right">
    <span class="nav-link" th:text="'Hello, ' + ${session.userName}">Hello</span>
    <a th:href="@{/logout}" class="nav-link">Sign out</a>
    <a th:href="@{/plan}" class="btn-new">+ New trip</a>
  </div>
</nav>

<div class="page-header">
  <div class="ph-eyebrow">Your journeys</div>
  <h1 class="ph-title">My <em>trips</em></h1>
  <p class="ph-count" th:text="${trips.size()} + ' itineraries saved'">0 itineraries saved</p>
</div>

<div class="content">
  <div th:if="${trips.empty}" class="empty-state">
    <div class="empty-icon">🗺️</div>
    <h2 class="empty-title">No trips yet</h2>
    <p class="empty-sub">Your saved itineraries will appear here. Start planning your first adventure with AI!</p>
    <a th:href="@{/plan}" class="btn-plan">✨ Plan my first trip</a>
  </div>

  <div th:unless="${trips.empty}" class="trips-grid">
    <div th:each="trip : ${trips}" class="trip-card">
      <div class="tc-header">
        <div class="tc-cities" th:text="${#strings.listJoin(trip.cities, ' & ')}">Jaipur & Agra</div>
        <div class="tc-date" th:text="${#temporals.format(trip.createdAt, 'dd MMM yyyy · HH:mm')}">27 May 2026</div>
      </div>
      <div class="tc-body">
        <div class="tc-tags">
          <span class="tc-tag" th:text="${trip.numberOfDays} + ' days'">3 days</span>
          <span class="tc-tag" th:text="${trip.familySize} + ' people'">4 people</span>
          <span class="tc-tag" th:text="${trip.budgetLevel}">mid</span>
          <span class="tc-tag" th:text="${trip.foodPreference}">veg</span>
        </div>
        <p class="tc-preview" th:text="${trip.generatedItinerary}">Preview...</p>
      </div>
      <div class="tc-footer">
        <a th:href="@{/trips/{id}(id=${trip.id})}" class="view-link">View itinerary →</a>
        <form th:action="@{/trips/{id}/delete(id=${trip.id})}" method="post" style="display:inline">
          <button type="submit" class="del-btn" onclick="return confirm('Delete this trip?')">🗑 Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
